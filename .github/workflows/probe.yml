# One-off probe of data source formats. Results are pushed to the `probe-output` branch.
name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/data/probe.sh
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rq --cached .
          git add -f probe-output
          git commit -qm "Probe results"
          git push -f origin probe-output
