# Refreshes country data monthly (and on demand), commits it, then redeploys the site.
# Run by hand: Actions -> "Update country data" -> Run workflow; `steps` limits which fetchers run.
name: Update country data

on:
  schedule:
    - cron: "17 3 2 * *" # 03:17 UTC on the 2nd of every month
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (space separated, empty = all). e.g. 'imf build'"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and build country data
        run: node scripts/data/run.ts ${{ inputs.steps }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      # Commit whatever succeeded, even if a step failed, so the results can be inspected.
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add --all -- data-cache public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -qm "Update country data"
            git pull -q --rebase origin main
            git push -q origin main
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
