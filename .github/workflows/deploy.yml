# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # used by data.yml after it commits new data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # when called from data.yml, deploy the data commit it just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:site # static country/ranking/comparison pages + link-preview images (scripts/site)
      - run: npm run test:site # broken links, preview images, sitemap, 404 forwarding: fail here, not live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub's publish step sometimes fails on its side ("Fetching artifact metadata failed", ~1 in 15 runs).
      # One retry after a minute, so the unattended monthly data deploy doesn't leave the site stale.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
